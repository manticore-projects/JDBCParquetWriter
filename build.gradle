import se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask

plugins {
    id 'java-library'

    id 'maven-publish'
    id 'signing'

    id 'jacoco'
    id "com.github.spotbugs" version "latest.release"
    id "com.diffplug.spotless" version "latest.release"
    id 'pmd'
    id 'checkstyle'

    id "org.hidetake.ssh" version "latest.release"
    id "se.bjurr.gitchangelog.git-changelog-gradle-plugin" version "latest.release"

    id "me.champeau.jmh" version "latest.release"

    // Upload the existing maven-publish publication to the Sonatype Central Portal.
    // (OSSRH / *.oss.sonatype.org was retired; the Portal API is the replacement.)
    // Pinned on purpose: this DSL is version-sensitive, bump it occasionally by hand.
    id "com.gradleup.nmcp" version "latest.release"
    id "com.gradleup.nmcp.aggregation" version "latest.release"
}

repositories {
    gradlePluginPortal()
    mavenLocal()
    mavenCentral()

    // NOTE: no snapshots repository on purpose. With version '+' everywhere, a snapshots repo
    // lets '+' resolve to unstable -SNAPSHOT builds (that is exactly how you ended up on
    // junit-jupiter 6.2.0-SNAPSHOT). If you ever truly need a specific snapshot, add it back
    // WITH content filtering so it can't hijack your '+' release resolution, e.g.:
    //   maven {
    //       url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    //       mavenContent { snapshotsOnly() }
    //       content { includeModule('com.manticore-projects.tools', 'xml-doclet') } // only what you need
    //   }
}


def getVersion = { boolean considerSnapshot ->
    Integer major = 0
    Integer minor = 0
    Integer patch = null
    Integer build = null
    String commit = null
    String snapshot = ""

    def versionStr = providers.exec {
        commandLine "git", "--no-pager", "-C", project.projectDir,  "describe", "--tags", "--always", "--dirty=-SNAPSHOT"
    }.standardOutput.asText.get().trim()

    def pattern = /(?<major>\d*)\.(?<minor>\d*)(\.(?<patch>\d*))?(-(?<build>\d*)-(?<commit>[a-zA-Z\d]*))?/
    def matcher = versionStr =~ pattern

    if (matcher.find()) {
        major = matcher.group('major') as Integer ?: 0
        minor = matcher.group('minor') as Integer ?: 0
        patch = matcher.group('patch') as Integer ?: null
        build = matcher.group('build') as Integer ?: null
        commit = matcher.group('commit') ?: null
    }

    if (considerSnapshot && (versionStr.endsWith('SNAPSHOT') || build != null)) {
        minor++
        if (patch != null) patch = 0
        snapshot = "-SNAPSHOT"
    }

    return patch != null
            ? "${major}.${minor}.${patch}${snapshot}"
            : "${major}.${minor}${snapshot}"
}
version = getVersion(true)
description = 'JDBC Table or ResultSet to Parquet File Writer'
group = "com.manticore-projects.jdbc"

configurations {
    xmlDoclet
}

dependencies {
    // parquet-hadoop transitively pulls parquet-column, parquet-encoding, parquet-common
    // and parquet-format-structures, so this single line replaces the four old declarations.
    // 'api' (not 'implementation') so downstream users of JDBCParquetWriter get the Parquet
    // writer types on their compile + runtime classpath automatically.
    api 'org.apache.parquet:parquet-hadoop:+'

    // Required: ParquetWriter references org.apache.hadoop.conf.Configuration / fs.Path / FileSystem
    // directly, so hadoop-common cannot be dropped. But everything it drags in for HDFS RPC, YARN,
    // the embedded web UIs and Kerberos is dead weight when we only write LOCAL files.
    //
    // These are PER-DEPENDENCY excludes (unlike the old resolutionStrategy block), so they are
    // written into the published POM's <exclusions> and every consumer inherits the slim graph.
    // hadoop-mapreduce-client-core is intentionally gone entirely — it was the main source of the
    // Guice / Jersey / YARN tree and is never needed to write a file with ParquetWriter.
    api('org.apache.hadoop:hadoop-common:+') {
        exclude group: 'io.netty'
        exclude group: 'org.codehaus.jettison'
        exclude group: 'org.mortbay.jetty'
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.websocket'
        exclude group: 'javax.servlet'
        exclude group: 'javax.servlet.jsp'
        exclude group: 'com.sun.jersey'
        exclude group: 'com.github.pjfanning'              // jersey-json fork in newer Hadoop
        exclude group: 'com.google.inject'                 // Guice
        exclude group: 'com.google.inject.extensions'
        exclude group: 'org.apache.curator'
        exclude group: 'org.apache.zookeeper'
        exclude group: 'org.apache.kerby'
        exclude group: 'org.bouncycastle'
        exclude group: 'com.google.protobuf'
        exclude group: 'org.yaml'
        exclude group: 'net.minidev', module: 'json-smart'
        exclude group: 'org.codehaus.jackson', module: 'jackson-mapper-asl'
        exclude group: 'org.apache.hadoop', module: 'hadoop-hdfs-client'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'dnsjava', module: 'dnsjava'
        exclude group: 'com.nimbusds', module: 'nimbus-jose-jwt'

        // Hadoop's embedded HTTP server + JAX-RS REST stack (Jersey 2 / HK2 / servlet / JSP).
        // Never exercised when writing local Parquet files.
        exclude group: 'org.glassfish.jersey.core'
        exclude group: 'org.glassfish.jersey.containers'
        exclude group: 'org.glassfish.jersey.inject'
        exclude group: 'org.glassfish.hk2'
        exclude group: 'org.glassfish.hk2.external'
        exclude group: 'org.javassist'
        exclude group: 'jakarta.ws.rs'
        exclude group: 'jakarta.servlet.jsp'
        exclude group: 'jakarta.validation'
        exclude group: 'jakarta.annotation'

        // Likely droppable too — verify tests pass after adding these.
        exclude group: 'org.glassfish.jaxb'
        exclude group: 'jakarta.xml.bind'
        exclude group: 'jakarta.activation'
        exclude group: 'com.sun.istack'
        exclude group: 'com.sun.activation'

        // on parquet-hadoop:
        exclude group: 'org.locationtech.jts'                              // Parquet geospatial stats; not used for SQL types

        // on hadoop-common:
        exclude group: 'com.google.code.findbugs', module: 'jsr305'        // annotation-only, leaked to runtime
        exclude group: 'org.apache.httpcomponents'                         // httpclient+httpcore: HTTP auth / KMS / WebHDFS — test
    }

    // Pure runtime codec — consumers never compile against it, so 'implementation' is enough;
    // it still lands in the POM at runtime scope and is pulled in automatically.
    implementation 'at.yawk.lz4:lz4-java:+'

    // Internal SQL parsing. Promote to 'api' only if your public API exposes JSqlParser types.
    api 'com.manticore-projects.jsqlformatter:jsqlparser:+'

    xmlDoclet 'com.manticore-projects.tools:xml-doclet:+'

    // Java 17 baseline now, so '+' (JUnit 6.x) is fine again.
    testImplementation platform('org.junit:junit-bom:6.0.+')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TableNamesFinderTest uses CollectionUtils. It used to leak in transitively via Hadoop;
    // declare it explicitly so the test classpath doesn't depend on Hadoop's internals.
    // NOTE: this is commons-collections *4* (package org.apache.commons.collections4) — see below.
    testImplementation 'org.apache.commons:commons-collections4:+'
    testImplementation 'com.h2database:h2:+'
    testImplementation 'org.duckdb:duckdb_jdbc:+'

    testImplementation 'org.openjdk.jmh:jmh-core:+'
    testImplementation 'org.openjdk.jmh:jmh-generator-annprocess:+'

    // Tell nmcp which project's publications to upload to the Central Portal (this one).
    nmcpAggregation(project)
}

configurations.configureEach {
    resolutionStrategy {
        // avoid using old Logging APIs with security issues
        force 'org.apache.logging.log4j:log4j-api:2.+'
        force 'org.apache.logging.log4j:log4j-core:2.+'
        force 'org.apache.logging.log4j:log4j-slf4j-impl:2.+'
        force 'org.apache.logging.log4j:log4j-jul:2.+'
        force 'org.slf4j:slf4j-log4j12:2.+'
        force 'org.apache.avro:avro:+'
        force 'org.apache.commons:commons-configuration2:+'

        capabilitiesResolution.withCapability('org.lz4:lz4-java') { details ->
            def realArtifact = details.candidates.find { it.id.group == 'at.yawk.lz4' }
            if (realArtifact != null) {
                details.select(realArtifact)
                details.because('org.lz4:lz4-java relocated to at.yawk.lz4:lz4-java; pick the real artifact')
            }
        }
    }
}

java {
    withSourcesJar()
    withJavadocJar()
    sourceCompatibility(JavaVersion.VERSION_11)
    targetCompatibility(JavaVersion.VERSION_17)

    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

javadoc {
    if(JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addBooleanOption("Xdoclint:none", true)
}

tasks.register('xmldoc', Javadoc) {
    dependsOn(compileJava)

    def outFile = layout.buildDirectory.file("reports/xmlDoclet/javadoc.xml").get().asFile
    source = sourceSets.main.allJava
    classpath = sourceSets.main.runtimeClasspath
    title = "JDBCParquetWriter API $version"
    destinationDir = layout.buildDirectory.dir("reports/xmlDoclet").get().asFile
    options.docletpath = configurations.xmlDoclet.files as List
    options.doclet = "com.manticore.tools.xmldoclet.XmlDoclet"
    options.addStringOption("basePackage", "com.manticore.jdbc")
    options.addStringOption("filename", outFile.getName())

    doLast {
        copy {
            from outFile
            into rootProject.layout.projectDirectory.dir("src/site/sphinx/_static").asFile
        }
    }
}

publish {
    dependsOn(check)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'jdbcparquetwriter'

            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'JDBCParquetWriter'
                description = 'JDBC Table or ResultSet to Parquet File Writer'
                url = 'https://manticore-projects.com/JDBCParquetWriter'
                licenses {
                    license {
                        name = 'The GNU GENERAL PUBLIC LICENSE, Version 3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                    }
                }
                developers {
                    developer {
                        id = 'are'
                        name = 'Andreas Reichel'
                        email = 'andreas@manticore-projects.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/manticore-projects/JDBCParquetWriter.git'
                    developerConnection = 'scm:git:ssh://git@github.com:manticore-projects/JDBCParquetWriter.git'
                    url = 'https://github.com/manticore-projects/JDBCParquetWriter'
                }
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"

            url = uri("https://maven.pkg.github.com/manticore-projects/jdbcparquetwriter")
            credentials(PasswordCredentials)
        }
    }
}

// Central Portal upload (nmcp). Credentials are a Portal *user token*, generated at
// https://central.sonatype.com/account -> "Generate User Token". Put them in
// ~/.gradle/gradle.properties as mavenCentralUsername / mavenCentralPassword, or pass
// them as ORG_GRADLE_PROJECT_mavenCentralUsername / ...Password environment variables.
nmcpAggregation {
    centralPortal {
        username = providers.gradleProperty("mavenCentralUsername")
        password = providers.gradleProperty("mavenCentralPassword")

        // AUTOMATIC = release as soon as validation passes (fire-and-forget).
        // Switch to "USER_MANAGED" if you'd rather click "Publish" yourself in the portal UI.
        publishingType = "AUTOMATIC"
    }
}

// Run the checks before pushing a release to Central.
tasks.matching { it.name == 'publishAggregationToCentralPortal' }.configureEach {
    dependsOn(check)
}

signing {
    sign publishing.publications.mavenJava
}


test {
    environment = [ 'SAMPLE_SIZE': '100000' ]

    // Use JUnit Platform for unit tests.
    useJUnitPlatform()

    jacoco {
        excludes = ['net/sf/jsqlparser/parser/CCJSqlParserTokenManager']
    }
}

jmh {
    iterations = 3 // Number of measurement iterations to do.
    benchmarkMode = ['avgt'] // Benchmark mode. Available modes are: [Throughput/thrpt, AverageTime/avgt, SampleTime/sample, SingleShotTime/ss, All/all]
    fork = 1 // How many times to forks a single benchmark. Use 0 to disable forking altogether
    failOnError = true // Should JMH fail immediately if any benchmark had experienced the unrecoverable error?
    humanOutputFile = project.file("${project.buildDir}/reports/jmh/human.txt") // human-readable output file
    resultsFile = project.file("${project.buildDir}/reports/jmh/results.txt") // results file
    resultFormat = 'CSV' // Result format type (one of CSV, JSON, NONE, SCSV, TEXT)
    timeUnit = 'ms' // Output time unit. Available time units are: [m, s, ms, us, ns].
    includeTests = true
}

spotbugsMain {
    reports {
        html {
            enabled = true
            destination = file("$buildDir/reports/spotbugs/main/spotbugs.html")
            stylesheet = 'fancy-hist.xsl'
        }
    }
}

spotbugs {
    excludeFilter = file("config/spotbugs/spotBugsExcludeFilter.xml")
}

pmd {
    consoleOutput = false
    sourceSets = [sourceSets.main]

    // clear the ruleset in order to use configured rules only
    ruleSets = []

    rulesMinimumPriority = 1
    ruleSetFiles = files("config/pmd/ruleset.xml")
}

checkstyle {
    sourceSets = [sourceSets.main, sourceSets.test]
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true
    }
}

spotless {
    // optional: limit format enforcement to just the files changed by this feature branch
    ratchetFrom 'origin/main'

    format 'misc', {
        // define the files to apply `misc` to
        target '*.rst', '*.md', '.gitignore'

        // define the steps to apply to those files
        trimTrailingWhitespace()
        leadingTabsToSpaces(4) // or spaces. Takes an integer argument if you don't like 4
        endWithNewline()
    }
    java {
        leadingTabsToSpaces(4)
        eclipse().configFile('config/formatter/eclipse-java-google-style.xml')
    }
}


jacocoTestReport {
    dependsOn test // tests are required to run before generating the report
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco')
    }
}
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.990
            }
        }
        rule {
            limit {
                counter = 'LINE'
                value = 'MISSEDCOUNT'
                maximum = 10
            }
        }
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'MISSEDRATIO'
                maximum = 0.05
            }
        }
    }
}

tasks.register('gitChangelogTask', GitChangelogTask) {
    fromRepo = file("$projectDir")
    file = new File("${projectDir}/src/site/sphinx/changelog.rst")
    fromRef = "1.0.0"
    //toRef = "1.1";

    // switch off the formatter since the indentation matters for Mark-down
    // @formatter:off
    templateContent ="""
************************
Changelog
************************


{{#tags}}
{{#ifMatches name "^Unreleased.*"}}
Latest Changes since |JDBCPARQUETWRITER_VERSION|
{{/ifMatches}}
{{#ifMatches name "^(?!Unreleased).*"}}
Version {{name}}
{{/ifMatches}}
=============================================================

 {{#issues}}

  {{#commits}}
   {{#ifMatches messageTitle "^(?!Merge).*"}}
  * **{{{messageTitle}}}**
    
    {{authorName}}, {{commitDate}}
   {{/ifMatches}}
  {{/commits}}

 {{/issues}}
{{/tags}}
"""
    // @formatter:on
}

remotes {
    webServer {
        host = findProperty("${project.name}.host")
        user = findProperty("${project.name}.username")
        identity = new File("${System.properties['user.home']}/.ssh/id_rsa")
    }
}

tasks.register('upload') {
    doFirst {
        if (findProperty("${project.name}.host") == null) {
            println(
                    """
                Property \"${project.name}.host\' not found.
                Please define \"${project.name}.host\" in the Gradle configuration (e. g. \$HOME/.gradle/gradle.properties.
                """
            )
        }
    }
    doLast {
        ssh.run {
            session(remotes.webServer) {
                def versionStable = getVersion(false)
                execute "mkdir -p download/${project.name}-${versionStable}"
                for (File file: fileTree(include:['*.jar'], dir:"${project.buildDir}/libs").collect()) {
                    put from: file, into: "download/${project.name}-${versionStable}"
                }
            }
        }
    }
}