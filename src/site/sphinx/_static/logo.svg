<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="940" height="200" role="img" aria-label="JDBCParquetWriter" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>JDBCParquetWriter</title>

  <style>
    .navy  { fill: #030146; }
    .amber { fill: #ff420e; }
    .wm    { font-family: "Roboto Slab", "DejaVu Serif", Georgia, serif; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .navy  { fill: #7b7bbd; }
      .amber { fill: #ff6b3d; }
    }
  </style>

  <!-- rows of a JDBC result set turning into the columns of a parquet file -->
  <g transform="translate(24 34)">
    <rect class="navy" x="0" y="6"   width="86" height="18" rx="3" opacity=".35"/>
    <rect class="navy" x="0" y="34"  width="86" height="18" rx="3" opacity=".55"/>
    <rect class="navy" x="0" y="62"  width="86" height="18" rx="3" opacity=".75"/>
    <rect class="navy" x="0" y="90"  width="86" height="18" rx="3" opacity=".55"/>
    <rect class="navy" x="0" y="118" width="86" height="18" rx="3" opacity=".35"/>

    <path class="amber" d="M104 64 h30 v-14 l26 22 -26 22 v-14 h-30 z"/>

    <rect class="navy"  x="180" y="0" width="18" height="136" rx="3"/>
    <rect class="navy"  x="208" y="0" width="18" height="136" rx="3" opacity=".75"/>
    <rect class="amber" x="236" y="0" width="18" height="136" rx="3"/>
    <rect class="navy"  x="264" y="0" width="18" height="136" rx="3" opacity=".5"/>
  </g>

  <text class="wm" x="330" y="96" font-size="52">
    <tspan class="navy">JDBC</tspan><tspan class="amber">Parquet</tspan><tspan class="navy">Writer</tspan>
  </text>
  <text class="wm navy" x="332" y="134" font-size="18" font-weight="400" opacity=".7" letter-spacing="3.2">RESULT SETS INTO COLUMNS</text>
</svg>
