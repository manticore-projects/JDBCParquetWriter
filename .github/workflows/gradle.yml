# Build and verify JDBCParquetWriter on every push and pull request.
#
# Uses actions that are not certified by GitHub. They are provided by a third party and are
# governed by separate terms of service, privacy policy and support documentation.

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch cancels an in-flight run of this workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with JDK ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain the build declares; 25 guards against the next LTS breaking us
        java: [ '21', '25' ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          # the version is derived from `git describe --tags`, so the full history and the
          # tags have to be present. Do NOT pin `ref: main` here: on a pull_request that
          # would check out the target branch and test the wrong code.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # the Gradle wrapper is not committed (see .gitignore), so the version is pinned
          # here instead. Remove this line once `gradle/wrapper/` is in the repository and
          # switch the build step below to `./gradlew`.
          gradle-version: '9.7.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build and check
        # `build` already runs `check`; `--stacktrace` makes a CI-only failure diagnosable
        run: gradle build --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk-${{ matrix.java }}
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore